[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nvp"
version = "1.0"
description = "A spatial Neovim manager for Tmux: Open files in dedicated panes without leaving your current shell."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "Jim Derry"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Text Editors",
]
dependencies = [
    "pynvim",
]

[project.scripts]
nvp = "nvp.core:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["nvp*"]

[tool.setuptools.package-data]
nvp = ["*.conf"]

