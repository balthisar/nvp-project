[Settings]
#===========================================
# nvp (Neovim Panes) Default Configuration
#===========================================

# The tmux pane index where Neovim should be launched or targeted.
# Default is 'None', which resolves to your tmux pane-base-index (usually 0).
user_default_pane = None

# Defines how nvp should split a busy pane to make room for Neovim.
# "v" = Vertical split (panes are side-by-side)
# "h" = Horizontal split (panes are stacked top-and-bottom)
split_direction = h

